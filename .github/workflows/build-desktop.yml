name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
            command: dist:win
            files: dist/*.exe
          - platform: Linux
            runner: ubuntu-24.04
            command: dist:linux
            files: dist/*.deb
          - platform: macOS
            runner: macos-15
            command: dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Orbit-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
