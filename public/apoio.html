<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060912">
  <title>Apoiar o Orbit</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=20261111-pix-copia-cola">
  <script src="./apoio.js?v=20261111-pix-copia-cola" defer></script>
</head>
<body>
  <main class="app-shell support-page">
    <section class="support-panel" aria-labelledby="support-heading">
      <h1 id="support-heading">Apoiar o Orbit</h1>
      <p>O apoio é voluntário e ajuda a manter as próximas versões do Orbit.</p>
      <label for="pix-key">Chave Pix aleatória</label>
      <input id="pix-key" type="text" value="bfd3db4d-75f3-4f61-a50a-311c33fdbfef" readonly spellcheck="false">
      <p>Escaneie o QR Code ou use Pix Copia e Cola no app do seu banco. Depois, escolha quanto doar.</p>
      <img class="support-qr" id="pix-qr" width="159" height="159" alt="QR Code Pix para apoiar o Orbit" hidden>
      <div class="pix-actions">
        <button class="button primary" id="copy-pix-code" type="button" hidden>Copiar código Pix</button>
        <button class="button" id="copy-pix" type="button" hidden>Copiar chave Pix</button>
      </div>
      <textarea id="pix-code" aria-label="Código Pix Copia e Cola" rows="3" readonly spellcheck="false" hidden></textarea>
      <p id="pix-status" role="status"></p>
    </section>
  </main>
</body>
</html>
